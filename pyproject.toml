[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "xlsform-to-registro"
version = "1.0.0"
description = "Generador de Diseños de Registro (Data Dictionaries) institucionales en Excel a partir de formularios XLSForm"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Diego Mora", url = "https://github.com/morabdiego" },
]
keywords = [
    "xlsform",
    "kobotoolbox",
    "odk",
    "data-dictionary",
    "codebook",
    "excel",
    "openpyxl",
    "survey",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "openpyxl>=3.1.2",
    "pandas>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/morabdiego/xlsform-to-registro"
Repository = "https://github.com/morabdiego/xlsform-to-registro.git"
Issues = "https://github.com/morabdiego/xlsform-to-registro/issues"

[project.scripts]
xlsform-to-registro = "xlsform_to_registro.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/xlsform_to_registro"]
